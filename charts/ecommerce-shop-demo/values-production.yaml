# Production overrides. Pass after values.yaml: -f values.yaml -f values-production.yaml
# (in Argo CD: helm.valueFiles: [values.yaml, values-production.yaml]).

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    memory: 768Mi

imagePullSecrets:
  - name: ghcr-pull

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: ecommerce-shop-demo.nuvraxis.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ecommerce-shop-demo-tls
      hosts:
        - ecommerce-shop-demo.nuvraxis.com

config:
  OTEL_SERVICE_NAME: ecommerce-shop-demo
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production
  # Canonical URLs, the sitemap and structured data are built from it. Match the ingress host.
  SITE_URL: https://ecommerce-shop-demo.nuvraxis.com

existingSecret: ecommerce-shop-demo-secrets
